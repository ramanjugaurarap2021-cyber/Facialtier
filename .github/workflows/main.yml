name: Build FacialTier APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o FacialTier_Android_Project.zip -d project
          echo "=== PROJECT FILES ==="
          find project/facialtier_android -maxdepth 3 -type f

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Create Gradle settings
        run: |
          cd project/facialtier_android

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FacialTier"
          include(":app")
          EOF

          echo "=== SETTINGS ==="
          cat settings.gradle

      - name: Build APK
        working-directory: project/facialtier_android
        run: |
          gradle assembleDebug --refresh-dependencies

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FacialTier-debug
          path: project/facialtier_android/**/build/outputs/apk/**/*.apk
