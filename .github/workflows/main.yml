name: Build FacialTier APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o FacialTier_Android_Project.zip -d project
          find project -maxdepth 3 -type f | head -50

      - name: Set up Java
        uses: uses: android-actions/setup-android@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: actions/setup-java@v4

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FacialTier-debug
          path: project/**/build/outputs/apk/**/*.apk
